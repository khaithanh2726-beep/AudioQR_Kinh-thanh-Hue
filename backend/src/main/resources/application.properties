# Tên ứng dụng backend
spring.application.name=backend
# JPA kiểm cấu trúc bảng hiện có và dùng UTC cho mốc thời gian JDBC
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Khóa ký và epoch được nhận từ biến môi trường
hueqr.guest.signing-key-base64=${HUEQR_GUEST_SIGNING_KEY_BASE64}
hueqr.guest.service-epoch=${HUEQR_SERVICE_EPOCH}
# Cookie quản trị chỉ gửi qua HTTPS, Q3 kiểm riêng mốc hoạt động chủ động
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
